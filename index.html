<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Техническая поддержка</title>
    <style>
        /* Стили для всей страницы */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        /* Контейнер с контентом */
        .support-container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        /* Заголовок */
        .support-title {
            color: #2d3748;
            font-size: 36px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .support-subtitle {
            color: #4a5568;
            font-size: 18px;
            margin-bottom: 40px;
            line-height: 1.5;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* Основная кнопка */
        #zammad-feedback-form {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 22px 55px;
            border-radius: 16px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }
        
        #zammad-feedback-form:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
        }
        
        #zammad-feedback-form:active {
            transform: translateY(-2px);
        }
        
        /* Преимущества */
        .features {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        
        .feature {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: #4a5568;
            font-size: 15px;
        }
        
        .feature-icon {
            font-size: 28px;
            background: rgba(102, 126, 234, 0.1);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Контактная информация */
        .contact-info {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px solid rgba(226, 232, 240, 0.5);
            color: #718096;
            font-size: 15px;
        }
        
        .contact-info p {
            margin: 5px 0;
        }
        
        /* Стили для формы Zammad */
        .zammad-form-modal .modal-content {
            border-radius: 20px !important;
            overflow: hidden !important;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4) !important;
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.98) 0%, 
                rgba(248, 250, 252, 0.98) 100%
            ) !important;
            border: none !important;
            backdrop-filter: blur(10px) !important;
        }
        
        .zammad-form-modal .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: white !important;
            padding: 25px 30px !important;
            text-align: left !important;
            font-size: 22px !important;
            font-weight: bold !important;
            display: flex !important;
            align-items: center !important;
            gap: 15px !important;
        }
        
        .zammad-form-modal .modal-header::before {
            content: '💬' !important;
            font-size: 26px !important;
        }
        
        .zammad-form-modal .modal-body {
            padding: 30px !important;
        }
        
        .zammad-form-field {
            margin-bottom: 25px !important;
        }
        
        .zammad-form-field label {
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            margin-bottom: 10px !important;
            color: #4a5568 !important;
            font-weight: 600 !important;
            font-size: 15px !important;
        }
        
        .zammad-form-field[data-name="name"] label::before {
            content: '👤 ' !important;
        }
        
        .zammad-form-field[data-name="email"] label::before {
            content: '📧 ' !important;
        }
        
        .zammad-form-field[data-name="body"] label::before {
            content: '💭 ' !important;
        }
        
        .zammad-form-modal input,
        .zammad-form-modal textarea {
            border: 2px solid #e2e8f0 !important;
            border-radius: 12px !important;
            padding: 16px 20px !important;
            font-size: 15px !important;
            width: 100% !important;
            background: white !important;
            transition: all 0.3s !important;
        }
        
        .zammad-form-modal input:focus,
        .zammad-form-modal textarea:focus {
            border-color: #667eea !important;
            outline: none !important;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15) !important;
        }
        
        .zammad-form-attachment {
            border: 2px dashed #cbd5e0 !important;
            border-radius: 12px !important;
            padding: 20px !important;
            text-align: center !important;
            background: rgba(248, 250, 252, 0.8) !important;
            margin-top: 15px !important;
        }
        
        .zammad-form-attachment label {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            gap: 10px !important;
            cursor: pointer !important;
            color: #4a5568 !important;
        }
        
        .zammad-form-attachment label::before {
            content: '📎' !important;
            font-size: 24px !important;
        }
        
        .zammad-form-modal .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            border: none !important;
            border-radius: 12px !important;
            padding: 18px !important;
            font-size: 18px !important;
            font-weight: bold !important;
            color: white !important;
            cursor: pointer !important;
            width: 100% !important;
            margin-top: 20px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 12px !important;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3) !important;
        }
        
        .zammad-form-modal .btn-primary::before {
            content: '🚀 ' !important;
            font-size: 20px !important;
        }
        
        .zammad-form-modal .alert-success {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%) !important;
            color: #155724 !important;
            border: none !important;
            border-radius: 15px !important;
            padding: 25px !important;
            text-align: center !important;
            font-size: 16px !important;
            border-left: 5px solid #28a745 !important;
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .support-container {
                padding: 30px 20px;
            }
            
            .support-title {
                font-size: 28px;
                flex-direction: column;
                gap: 10px;
            }
            
            .support-subtitle {
                font-size: 16px;
            }
            
            #zammad-feedback-form {
                padding: 20px 40px;
                font-size: 20px;
            }
            
            .features {
                gap: 25px;
            }
        }
        
        @media (max-width: 480px) {
            .support-title {
                font-size: 24px;
            }
            
            #zammad-feedback-form {
                padding: 18px 30px;
                font-size: 18px;
                flex-direction: column;
                gap: 10px;
            }
            
            .features {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="support-container">
        <!-- Заголовок -->
        <h1 class="support-title">
            <span>🛠️</span>
            <span>Техническая поддержка</span>
        </h1>
        
        <p class="support-subtitle">
            Столкнулись с проблемой или есть вопросы?
            Опишите вашу проблему, и мы найдём решение в кратчайшие сроки.
        </p>
        
        <!-- Главная кнопка -->
        <button id="zammad-feedback-form">
            <span style="font-size: 26px;">💬</span>
            <span>Написать в поддержку</span>
        </button>
        
        <!-- Контактная информация -->
        <div class="contact-info">
            <p><strong>📍 Альтернативные способы связи:</strong></p>
            <p>📧 Email: 1_support@autoeuro.ru</p>
            <p>🕒 Часы работы: 7 дней в неделю, 9:00-21:00</p>
            <p style="margin-top: 15px; font-size: 13px; color: #cbd5e0;">
                Отвечаем в течение 15 минут.
            </p>
        </div>
    </div>

    <!-- Подключаем jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Подключаем скрипт формы Zammad -->
    <script id="zammad_form_script" src="http://zammad.autoeuro.ru/assets/form/form.js"></script>
    
    <!-- Настройка формы -->
    <script>
    $(function() {
        $('#zammad-feedback-form').ZammadForm({
            messageTitle: '💬 Форма обратной связи',
            messageSubmit: '🚀 Отправить сообщение',
            messageThankYou: `
                <div style="text-align: center; padding: 20px;">
                    <div style="font-size: 48px; margin-bottom: 20px;">✅</div>
                    <h3 style="color: #155724; margin-bottom: 15px;">Сообщение отправлено!</h3>
                    <p style="color: #155724; margin-bottom: 10px;">
                        <b>Ваш запрос #%s зарегистрирован в системе</b>
                    </p>
                    <p style="color: #0c5460; font-size: 14px; margin-bottom: 20px;">
                        Наш специалист свяжется с вами в ближайшее время
                    </p>
                    <div style="padding: 15px; background: rgba(40, 167, 69, 0.1); border-radius: 10px; margin-top: 20px;">
                        <p style="margin: 0; font-size: 13px; color: #0c5460;">
                            <strong>📧</strong> Ответ придёт на указанный вами email адрес
                        </p>
                    </div>
                </div>
            `,
            modal: true,
            attachmentSupport: true,
            showTitle: true,
            
            // Настройка полей формы
            attributes: [
                {
                    display: 'Ваше имя',
                    name: 'name',
                    tag: 'input',
                    type: 'text',
                    placeholder: 'Как к вам обращаться?',
                    required: true
                },
                {
                    display: 'Email для связи',
                    name: 'email',
                    tag: 'input',
                    type: 'email',
                    placeholder: 'example@email.com',
                    required: true
                },
                {
                    display: 'Сообщение',
                    name: 'body',
                    tag: 'textarea',
                    placeholder: 'Опишите вашу проблему или вопрос максимально подробно...',
                    rows: 6,
                    required: true
                }
            ],
            
            // Дополнительные параметры
            backgroundColor: 'transparent',
            color: '#2d3748',
            fontSize: '14px',
            buttonColor: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
            buttonTextColor: 'white'
        });
        
        // Добавляем анимацию при клике на кнопку
        $('#zammad-feedback-form').on('click', function() {
            $(this).css({
                'transform': 'scale(0.95)',
                'transition': 'transform 0.1s'
            });
            
            setTimeout(() => {
                $(this).css({
                    'transform': '',
                    'transition': 'all 0.3s'
                });
            }, 100);
        });
    });
    </script>
</body>
</html>
